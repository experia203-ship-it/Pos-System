function renderCustomers(){const a=filtered(db.customers,state.customerFilter,"name","location","phone","shipping");$("#screen-customers").innerHTML=`<div class="topbar"><div><h1 class="page-title">Customers</h1><p class="subtitle">Customer directory and order accounts.</p></div><button class="btn" id="newCustomer">＋ Create customer</button></div><div class="card"><div class="toolbar"><div class="search grow"><input class="input" id="customerSearch" placeholder="Search customers…" value="${esc(state.customerFilter)}"></div></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Location</th><th>Shipping company</th><th>Mobile number</th><th>Actions</th></tr></thead><tbody>${a.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.location)}</td><td>${esc(c.shipping)}</td><td>${esc(c.phone)}</td><td><div class="actions"><button class="btn secondary small" data-edit-customer="${c.id}">Update</button><button class="link" data-delete-customer="${c.id}">Delete</button></div></td></tr>`).join("")}</tbody></table></div></div>`;$("#customerSearch").oninput=e=>{state.customerFilter=e.target.value;renderCustomers()};$("#newCustomer").onclick=()=>customerModal();$$("[data-edit-customer]").forEach(b=>b.onclick=()=>customerModal(Number(b.dataset.editCustomer)));$$("[data-delete-customer]").forEach(b=>b.onclick=()=>{if(confirm("Delete this customer?")){db.customers=db.customers.filter(c=>c.id!=b.dataset.deleteCustomer);save();renderCustomers();toast("Customer deleted")}})}
function customerModal(id=null){const c=id?db.customers.find(x=>x.id==id):{name:"",location:"",shipping:"",phone:""};showModal(`<div class="modal-head"><h2>${id?"Update":"Create"} customer</h2><button class="icon-btn" id="closeModal">×</button></div><form id="customerForm"><div class="form-grid"><div class="form-field full"><label>Name *</label><input class="input" name="name" required value="${esc(c.name)}"></div><div class="form-field"><label>Location</label><input class="input" name="location" value="${esc(c.location)}"></div><div class="form-field"><label>Mobile number</label><input class="input" name="phone" value="${esc(c.phone)}"></div><div class="form-field full"><label>Shipping company</label><input class="input" name="shipping" value="${esc(c.shipping)}"></div></div><div class="form-actions"><button type="button" class="btn secondary" id="cancelForm">Close</button><button class="btn">Save customer</button></div></form>`);$("#closeModal").onclick=closeModal;$("#cancelForm").onclick=closeModal;$("#customerForm").onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(id)Object.assign(c,v);else db.customers.push({id:Math.max(0,...db.customers.map(x=>x.id))+1,...v});save();closeModal();renderCustomers();toast(id?"Customer updated":"Customer created")}}
function renderVendors(){const a=filtered(db.vendors,state.vendorFilter,"name","location","mobile","landline");$("#screen-vendors").innerHTML=`<div class="topbar"><div><h1 class="page-title">Vendors</h1><p class="subtitle">Suppliers for purchase orders and stock intake.</p></div><button class="btn" id="newVendor">＋ Create vendor</button></div><div class="card"><div class="toolbar"><div class="search grow"><input class="input" id="vendorSearch" placeholder="Search vendors…" value="${esc(state.vendorFilter)}"></div></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Location</th><th>Landline</th><th>Mobile</th><th>Actions</th></tr></thead><tbody>${a.map(v=>`<tr><td>${v.id}</td><td><strong>${esc(v.name)}</strong></td><td>${esc(v.location)}</td><td>${esc(v.landline)}</td><td>${esc(v.mobile)}</td><td><div class="actions"><button class="btn secondary small" data-edit-vendor="${v.id}">Update</button><button class="link" data-delete-vendor="${v.id}">Delete</button></div></td></tr>`).join("")}</tbody></table></div></div>`;$("#vendorSearch").oninput=e=>{state.vendorFilter=e.target.value;renderVendors()};$("#newVendor").onclick=()=>vendorModal();$$("[data-edit-vendor]").forEach(b=>b.onclick=()=>vendorModal(Number(b.dataset.editVendor)));$$("[data-delete-vendor]").forEach(b=>b.onclick=()=>{if(confirm("Delete this vendor?")){db.vendors=db.vendors.filter(v=>v.id!=b.dataset.deleteVendor);save();renderVendors();toast("Vendor deleted")}})}
function vendorModal(id=null){const v=id?db.vendors.find(x=>x.id==id):{name:"",location:"",mobile:"",landline:""};showModal(`<div class="modal-head"><h2>${id?"Update":"Create"} vendor</h2><button class="icon-btn" id="closeModal">×</button></div><form id="vendorForm"><div class="form-grid"><div class="form-field full"><label>Name *</label><input class="input" name="name" required value="${esc(v.name)}"></div><div class="form-field"><label>Location</label><input class="input" name="location" value="${esc(v.location)}"></div><div class="form-field"><label>Mobile</label><input class="input" name="mobile" value="${esc(v.mobile)}"></div><div class="form-field"><label>Landline</label><input class="input" name="landline" value="${esc(v.landline)}"></div></div><div class="form-actions"><button type="button" class="btn secondary" id="cancelForm">Close</button><button class="btn">Save vendor</button></div></form>`);$("#closeModal").onclick=closeModal;$("#cancelForm").onclick=closeModal;$("#vendorForm").onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));if(id)Object.assign(v,x);else db.vendors.push({id:Math.max(0,...db.vendors.map(x=>x.id))+1,...x});save();closeModal();renderVendors();toast(id?"Vendor updated":"Vendor created")}}
function renderSummary(){const total=db.orders.reduce((a,o)=>a+o.total,0),paid=db.orders.reduce((a,o)=>a+o.paid,0);$("#screen-summary").innerHTML=`<div class="topbar"><div><h1 class="page-title">Summary</h1><p class="subtitle">Customer balances and order history.</p></div></div><div class="grid grid-3"><div class="card stat-card"><div><div class="stat-label">Total sales</div><div class="stat-value">${money(total)}</div></div><div class="stat-icon">↗</div></div><div class="card stat-card"><div><div class="stat-label">Paid</div><div class="stat-value">${money(paid)}</div></div><div class="stat-icon">✓</div></div><div class="card stat-card"><div><div class="stat-label">Outstanding</div><div class="stat-value">${money(total-paid)}</div></div><div class="stat-icon">◷</div></div></div><div class="card" style="margin-top:16px"><div class="toolbar"><div class="search grow"><input class="input" id="summaryCustomer" placeholder="Search customer name…"></div><input class="input" id="summaryFrom" type="date" value="2026-09-01"><span style="color:var(--muted)">to</span><input class="input" id="summaryTo" type="date" value="2026-09-30"></div><div id="summaryBody">${summaryRows("")}</div></div>`;$("#summaryCustomer").oninput=e=>$("#summaryBody").innerHTML=summaryRows(e.target.value);$("#summaryFrom").onchange=()=>{$("#summaryBody").innerHTML=summaryRows($("#summaryCustomer").value)};$("#summaryTo").onchange=()=>{$("#summaryBody").innerHTML=summaryRows($("#summaryCustomer").value)}}
function summaryRows(q){const a=db.orders.filter(o=>!q||o.customer.toLowerCase().includes(q.toLowerCase()));return a.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Paid</th><th>Remaining</th></tr></thead><tbody>${a.map(o=>`<tr><td><strong>#${o.number}</strong></td><td>${esc(o.customer)}</td><td>${o.date}</td><td>${money(o.total)}</td><td>${money(o.paid)}</td><td><span class="badge ${o.total-o.paid?"orange":"green"}">${money(o.total-o.paid)}</span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No orders found.</div>`}
function renderStats(){const sales=db.orders.reduce((a,o)=>a+o.total,0),profit=db.orders.reduce((a,o)=>a+o.items.reduce((x,i)=>x+i.qty*i.price*.28,0),0),counts={};db.orders.forEach(o=>o.items.forEach(i=>counts[i.name]=(counts[i.name]||0)+i.qty));const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]);$("#screen-stats").innerHTML=`<div class="topbar"><div><h1 class="page-title">Statistics</h1><p class="subtitle">Sales performance and best-selling products.</p></div><div class="inline"><input class="input" id="statsFrom" type="date" value="2026-09-01"><span>to</span><input class="input" id="statsTo" type="date" value="2026-09-30"><button class="btn" id="applyStats">Apply</button></div></div><div class="grid grid-4"><div class="card stat-card"><div><div class="stat-label">Total sales</div><div class="stat-value">${money(sales)}</div></div><div class="stat-icon">↗</div></div><div class="card stat-card"><div><div class="stat-label">Total profit</div><div class="stat-value">${money(profit)}</div></div><div class="stat-icon">◆</div></div><div class="card stat-card"><div><div class="stat-label">Orders</div><div class="stat-value">${db.orders.length}</div></div><div class="stat-icon">#</div></div><div class="card stat-card"><div><div class="stat-label">Average order</div><div class="stat-value">${money(db.orders.length?sales/db.orders.length:0)}</div></div><div class="stat-icon">∿</div></div></div><div class="grid grid-2" style="margin-top:16px"><div class="card"><h3>Sales overview</h3><div class="chart">${[42,66,54,82,70,96,75].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${money(sales*(h/600))}</span><small>${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i]}</small></div>`).join("")}</div></div><div class="card"><h3>Top selling items</h3>${top.slice(0,5).map((x,i)=>`<div class="sum-row"><span>${i+1}. ${esc(x[0])}</span><b>${x[1]} sold</b></div>`).join("")||`<div class="empty">No sales yet.</div>`}</div></div><div class="card" style="margin-top:16px"><h3>Least selling items</h3><div class="table-wrap"><table><thead><tr><th>Item</th><th>Quantity sold</th></tr></thead><tbody>${Object.entries(counts).sort((a,b)=>a[1]-b[1]).slice(0,5).map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join("")}</tbody></table></div></div>`;$("#applyStats").onclick=()=>toast("Statistics refreshed for selected timeframe")}
function renderSettings(){$("#screen-settings").innerHTML=`<div class="topbar"><div><h1 class="page-title">Settings</h1><p class="subtitle">Company profile, appearance, printing and POS behavior.</p></div><button class="btn" id="saveSettings">Save settings</button></div><div class="settings-grid"><div class="card settings-nav"><button class="active">General</button><button>Appearance</button><button>Printing</button><button>Language</button></div><div class="card"><h3>Company profile</h3><div class="form-grid"><div class="form-field"><label>Company name</label><input class="input" id="setCompany" value="${esc(db.settings.company)}"></div><div class="form-field"><label>Phone number</label><input class="input" id="setPhone" value="${esc(db.settings.phone)}"></div><div class="form-field full"><label>Address</label><input class="input" id="setAddress" value="${esc(db.settings.address)}"></div><div class="form-field"><label>Tax registration number</label><input class="input" id="setTax" value="${esc(db.settings.tax)}"></div><div class="form-field"><label>Currency symbol</label><input class="input" id="setCurrency" value="${esc(db.settings.currency)}"></div></div><hr style="border:0;border-top:1px solid var(--line);margin:21px 0"><h3>Appearance & behavior</h3><div class="form-grid"><div class="form-field"><label>Theme</label><select class="select" id="setTheme"><option value="light" ${db.settings.theme==="light"?"selected":""}>Light</option><option value="dark" ${db.settings.theme==="dark"?"selected":""}>Dark</option><option value="system">System default</option></select></div><div class="form-field"><label>Language</label><select class="select" id="setLanguage"><option value="en" ${db.settings.language==="en"?"selected":""}>English</option><option value="ar" ${db.settings.language==="ar"?"selected":""}>العربية</option></select></div><div class="form-field"><label>Print size</label><select class="select" id="setPrint"><option>A4</option><option ${db.settings.print==="A5"?"selected":""}>A5</option><option>THERMAL</option></select></div><div class="form-field"><label>POS layout</label><select class="select" id="setPosStyle"><option>HORIZONTAL</option><option>COMPACT</option></select></div></div><div style="margin-top:18px"><label style="display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:7px">Company logo</label><div class="logo-preview">${db.settings.logo?`<img src="${db.settings.logo}" style="max-width:140px;max-height:76px">`:"LOGO"}</div><input type="file" id="logoFile" accept="image/png,image/jpeg"><div style="font-size:11px;color:var(--muted);margin-top:5px">Stored locally in this browser for the demo.</div></div><label class="inline" style="margin-top:18px;font-size:13px"><input id="setShift" type="checkbox" ${db.settings.shift?"checked":""}> Enable shift management</label></div></div>`;$("#saveSettings").onclick=saveSettings;$("#logoFile").onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader;r.onload=()=>{db.settings.logo=r.result;renderSettings();toast("Logo selected — save settings to persist")};r.readAsDataURL(f)}}}
function saveSettings(){Object.assign(db.settings,{company:$("#setCompany").value,phone:$("#setPhone").value,address:$("#setAddress").value,tax:$("#setTax").value,currency:$("#setCurrency").value,theme:$("#setTheme").value==="system"?"light":$("#setTheme").value,language:$("#setLanguage").value,print:$("#setPrint").value,posStyle:$("#setPosStyle").value,shift:$("#setShift").checked});save();applySettings();toast("Settings saved");render()}
function barcodePreview(p){showModal(`<div class="modal-head"><h2>Barcode preview</h2><button class="icon-btn" id="closeModal">×</button></div><div class="print-paper" style="text-align:center"><strong>${esc(p.name)}</strong><div class="barcode"></div><div class="barcode-number">${esc(p.barcode||"NO BARCODE")}</div><strong>${money(p.sellingPrice)}</strong></div><div class="form-actions"><button class="btn secondary" id="cancelForm">Close</button><button class="btn" id="printNow">Print label</button></div>`);$("#closeModal").onclick=closeModal;$("#cancelForm").onclick=closeModal;$("#printNow").onclick=()=>window.print()}
function exportCsv(){const lines=["name,partNumber,description,sellingPrice,purchasePrice,stock,reorderPoint,category,barcode",...db.products.map(p=>[p.name,p.partNumber,p.description,p.sellingPrice,p.purchasePrice,p.stock,p.reorderPoint,p.category,p.barcode].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","))];const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));a.download="products.csv";a.click();URL.revokeObjectURL(a.href);toast("CSV exported")}
function importCsv(e){const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{const rows=r.result.split(/\r?\n/).slice(1).filter(Boolean);rows.forEach(row=>{const x=row.split(",").map(v=>v.replace(/^"|"$/g,""));if(x[0])db.products.push({id:Math.max(...db.products.map(p=>p.id))+1,name:x[0],partNumber:x[1]||"IMP-"+Date.now(),description:x[2]||"",sellingPrice:Number(x[3])||0,purchasePrice:Number(x[4])||0,stock:Number(x[5])||0,reorderPoint:Number(x[6])||0,category:x[7]||"General",barcode:x[8]||""})});save();renderInventory();toast(`${rows.length} products imported`)};r.readAsText(f)}
applySettings();render();
</script>
</body>
