<div>
    <h2 class="page-heading">
        <svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
        <span th:text="#{stats.title}">Statistics</span>
    </h2>

    <div>
        <label for="time-range" th:text="#{stats.timeframe.label}">Select timeframe:</label>
        <input id="time-range"
               type="text"
               name="dateRange"
               hx-get="/pos/CustomerOrderSummary"
               hx-trigger="change"
               hx-include="#summary-customer-id"
               hx-target="#stat-res"
               hx-swap="innerHTML"
               th:placeholder="#{stats.timeframe.placeholder}"
               readonly>
    </div>

</div>

<div style="margin-top: 15px;">

    <label for="customer" th:text="#{stats.customer.label}">search for customer name:</label>
    <input id="customer" type="text" name="name" th:value="${param.name}" hx-get="/customers/search2" hx-target="#cust-res" hx-trigger="keyup changed delay 300ms" th:placeholder="#{stats.customer.placeholder}"  />

</div>

<div id="cust-res">


</div>

<article id="stat-res" style="margin-top: 20px;" th:text="#{stats.select.dates}">
    Select dates to view stats
</article>

<link rel="stylesheet" th:href="@{/css/flatpickr.min.css}">
<script th:src="@{/js/flatpickr.min.js}"></script>

<script>
    (function () {
        flatpickr("#time-range", {
            mode: "range",
            dateFormat: "Y-m-d",
            showMonths: 2,
            allowInput: false,
            onClose: function (selectedDates, dateStr, instance) {
                document.getElementById('time-range').dispatchEvent(new Event('change',{bubbles:true}));
            }
        });
    })();
</script>
