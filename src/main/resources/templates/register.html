<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <title th:text="#{register.title}">pos system -registration</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <script th:src="@{/js/htmx.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/pico.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <svg class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        <h2 th:text="#{register.heading}">Register a new Cashier</h2>

        <form hx-post="/auth/register" hx-target="#form-message" hx-swap="innerHTML"
              th:object="${userForm}">
            <label>
                <span th:text="#{register.label.name}">Name:</span>
                <input type="text" th:field="*{name}" required>
            </label>
            <label>
                <span th:text="#{register.label.email}">Email:</span>
                <input type="email" th:field="*{email}" required>
            </label>
            <label>
                <span th:text="#{register.label.password}">Password:</span>
                <input type="password" th:field="*{password}" required>
            </label>
            <button type="submit" style="width: 100%;" th:text="#{register.btn.submit}">Create Account</button>
            <button type="button" style="width: 100%;" th:onclick="window.location.href='/layout'" th:text="#{register.btn.cancel}">Cancel</button>
        </form>
        <div id="form-message" class="form-error"></div>
    </div>
</div>
<script>
document.body.addEventListener('htmx:configRequest', function(evt) {
    const token = document.querySelector('meta[name="_csrf"]');
    const header = document.querySelector('meta[name="_csrf_header"]');
    if (token && header) {
        evt.detail.headers[header.content] = token.content;
    }
});
</script>
</body>
</html>
