<div id="reorder-div">

    <hgroup style="margin-bottom: 2rem;">
        <h2 class="page-heading" style="margin-bottom: 0.25rem;">
            <svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            <span th:text="#{reorder.title}">Restock Required</span>
        </h2>
        <p>
            <span th:text="#{reorder.totalBelowThreshold}">Total items below minimum threshold:</span>
            <strong th:text="${count}" style="color: var(--brand-red);">0</strong>
        </p>
    </hgroup>

    <article th:if="${!products.hasContent()}" class="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 0.75rem; display: block;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <h3 style="margin-bottom: 0.5rem;" th:text="#{reorder.healthy.title}">Inventory Healthy</h3>
        <p style="color: var(--pico-muted-color); margin: 0;" th:text="#{reorder.healthy.desc}">No restock is needed for now. Check back later.</p>
    </article>

    <figure th:if="${products.hasContent()}">
        <table role="grid" class="striped">
            <thead>
            <tr>
                <th scope="col" th:text="#{reorder.table.id}">ID</th>
                <th scope="col" th:text="#{products.table.name}">Name</th>
                <th scope="col" th:text="#{reorder.table.partNumber}">Part #</th>
                <th scope="col" th:text="#{products.table.stock}">Stock</th>
                <th scope="col" th:text="#{reorder.table.reorderPoint}">Reorder Point</th>
                <th scope="col" th:text="#{products.table.category}">Category</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products.content}">
                <td th:text="${product.id}" style="color: var(--pico-muted-color);"></td>
                <td><strong th:text="${product.name}"></strong></td>
                <td th:text="${product.partNumber}" style="font-family: monospace;"></td>
                <td th:text="${product.stock}" style="color: var(--brand-red); font-weight: bold;"></td>
                <td th:text="${product.reorderPoint}"></td>
                <td th:text="${catMap != null and product.categoryId != null ? (catMap.get(product.categoryId) ?: #messages.msg('reorder.category.none')) : #messages.msg('reorder.category.none')}"></td>
            </tr>
            </tbody>
        </table>
    </figure>

    <!-- Pagination Footer -->
    <div th:if="${products.hasContent()}" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 10px 0;">

        <div class="pagination-info">
            <span th:text="#{pagination.showing}">Showing</span>
            <span th:text="${products.totalElements > 0 ? (products.number * products.size + 1) : 0}"></span>
            <span th:text="#{pagination.to}">to</span>
            <span th:text="${products.number * products.size + products.numberOfElements}"></span>
            <span th:text="#{pagination.of}">of</span>
            <strong th:text="${products.totalElements}"></strong> <span th:text="#{pagination.entries}">entries</span>
        </div>

        <nav style="display: flex; align-items: center; gap: 10px;">
            <button th:if="${products.hasPrevious()}"
                    th:hx-get="@{/products/reorder-point(page=${products.number-1})}"
                    hx-target="#reorder-div"
                    hx-swap="outerHTML"
                    hx-push-url="true"
                    class="secondary small"
                    th:text="#{pagination.previous}">
                previous
            </button>

            <span style="font-size: 0.9em; font-weight: 500;">
                <span th:text="#{pagination.page}">page</span> [[${products.number+1}]] <span th:text="#{pagination.of}">of</span> [[${products.totalPages == 0 ? 1 : products.totalPages}]]
            </span>

            <button th:if="${products.hasNext()}"
                    th:hx-get="@{/products/reorder-point(page=${products.number+1})}"
                    hx-target="#reorder-div"
                    hx-swap="outerHTML"
                    hx-push-url="true"
                    class="secondary small"
                    th:text="#{pagination.next}">
                next
            </button>
        </nav>
    </div>
</div>
