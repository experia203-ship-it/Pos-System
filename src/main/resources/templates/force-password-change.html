<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <title th:text="#{forcepw.title}">Set a new password</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <script th:src="@{/js/htmx.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/pico.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h2 th:text="#{forcepw.heading}">Set your own password</h2>
        <p th:text="#{forcepw.intro}">For your security, please choose your own password before using the system.</p>

        <div id="password-error" class="form-error"></div>
        <form hx-post="/auth/change-password" hx-target="#password-success" hx-swap="innerHTML">
            <!-- The default admin never typed the current password, so it is filled in for them. -->
            <input th:if="${defaultAdmin}" type="hidden" name="currentPassword" th:value="${currentPassword}">
            <label th:unless="${defaultAdmin}">
                <span th:text="#{preferences.password.current}">Current password</span>
                <input type="password" name="currentPassword" required autocomplete="current-password">
            </label>
            <label>
                <span th:text="#{preferences.password.new}">New password</span>
                <input type="password" name="newPassword" required autocomplete="new-password">
            </label>
            <label>
                <span th:text="#{preferences.password.confirm}">Confirm new password</span>
                <input type="password" name="confirmPassword" required autocomplete="new-password">
            </label>
            <button type="submit" style="width: 100%;" th:text="#{preferences.password.submit}">Change password</button>
        </form>
        <div id="password-success"></div>
    </div>
</div>
<script>
document.body.addEventListener('htmx:configRequest', function(evt) {
    const token = document.querySelector('meta[name="_csrf"]');
    const header = document.querySelector('meta[name="_csrf_header"]');
    if (token && header) {
        evt.detail.headers[header.content] = token.content;
    }
});
</script>
</body>
</html>
