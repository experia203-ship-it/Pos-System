<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}">pos system -login</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <script th:src="@{/js/htmx.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/water.css}">
</head>

<body>
<h2 th:text="#{login.heading}">login here!</h2>

<form th:object="${loginForm}" hx-post="/auth/login" hx-target="#form-message" hx-swap="innerHTML">

    <div>
        <label>
            <span th:text="#{login.label.email}">email:</span>
            <input id="email" name="email" type="email"
                   th:value="${prefillEmail}"
                   autocomplete="username" required>
        </label>
    </div>
    <div>
        <label>
            <span th:text="#{login.label.password}">password:</span>
            <input id="password" name="password" type="password"
                   th:value="${prefillPassword}"
                   autocomplete="current-password" required>
        </label>
    </div>

    <button type="submit" th:text="#{login.btn.submit}">login</button>

</form>
<div id="form-message" th:attr="data-error=#{error.login.invalidCredentials}"></div>

<script>
    document.body.addEventListener('htmx:configRequest', function(evt) {
        const token = document.querySelector('meta[name="_csrf"]');
        const header = document.querySelector('meta[name="_csrf_header"]');
        if (token && header) {
            evt.detail.headers[header.content] = token.content;
        }
    });

    // htmx ignores non-2xx responses; show a message anyway.
    document.body.addEventListener('htmx:responseError', function() {
        var box = document.getElementById('form-message');
        box.innerHTML = '';
        var d = document.createElement('div');
        d.style.color = '#c0392b';
        d.style.marginTop = '1rem';
        d.textContent = box.getAttribute('data-error');
        box.appendChild(d);
    });
</script>

</body>
</html>
