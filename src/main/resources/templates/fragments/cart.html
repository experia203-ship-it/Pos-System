<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org" >
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <title>Title</title>
</head>
<body>












<div id="cart-zone" th:fragment="cart">






    <div id="customer-fragment" th:fragment="customer-fragment">
        <form id="customerInfo" >
            <lablel for="customer-List">Customer: </lablel>
            <select id="customer-list" name="customerId" form="active-cart-form"

                    hx-post="/pos/cart/update"
                    hx-trigger="change"
                    hx-include="#active-cart-form, #disc, #paid, #customerInfo"
                    hx-target="#cart-zone"
                    hx-swap="outerHTML">


                <option value="" disabled th:selected="${currentCustomerId == null}" > select a customer</option>
                <option th:each=" cust :${customers}"
                        th:value="${cust.id}"
                        th:text="${cust.name}"
                        th:selected="${cust.id==currentCustomerId}"
                > customer name</option>

            </select>
            <div id="customer-error"  style="color: red; font-weight: bold; margin-top: 5px;"></div>
        </form>
        <button hx-get="/customers/create"
                hx-target="#modal-container-cust"
                hx-swap="innerHTML"
        > create customer</button>
    </div>











<form id="active-cart-form">

<input  type="hidden"  th:name="ordId" th:value="${ordId}">
    <table role="grid">
        <thead>
        <tr>
            <th>ItemName</th>
            <th>Quantity</th>
            <th>subDisc</th>
            <th>Price</th>
            <th>SubTotal</th>
            <th></th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item,stat :${cartItems}">

        <td>
            <input type="hidden" th:name="|itemsList[${stat.index}].productId|" th:value="${item.productId}"/>
            <input type="hidden" th:name="|itemsList[${stat.index}].customPurchasePrice|" th:value="${item.customPurchasePrice}" />


            <input type="text" th:name="|itemsList[${stat.index}].customName|"
            th:value="${item.customName!=null ? item.customName : item.productName}"
                   hx-post="/pos/cart/update"
                   hx-trigger="change delay:500ms"
                   hx-include="#active-cart-form , #disc , #paid ,#customerInfo"
                   hx-target="#cart-zone"
                   hx-swap="outerHTML"
            />
        </td>

        <td><input type="number" th:name="|itemsList[${stat.index}].quantity|" th:value="${item.quantity}"

                   hx-post="/pos/cart/update"
                   hx-trigger="change"
                   hx-include="#active-cart-form , #disc , #paid ,#customerInfo"
                   hx-target="#cart-zone"
                   hx-swap="outerHTML"
        />
        </td>
            <td>
         <input type="number" step="0.01" th:name="|itemsList[${stat.index}].subDiscount|"  th:value="${item.subDiscount}"

         hx-post="/pos/cart/update"
         hx-trigger="change"
         hx-include="#active-cart-form ,#disc ,#paid ,#customerInfo"
         hx-target="#cart-zone"
                hx-swap="outerHTML"
         />

            </td>
            <td>
                <input type="number" th:name="|itemsList[${stat.index}].customSellingPrice|"
                th:value="${item.customSellingPrice!=null ? item.customSellingPrice : item.sellingPrice}"
                       hx-post="/pos/cart/update"
                       hx-trigger="change"
                       hx-include="#active-cart-form , #disc , #paid ,#customerInfo"
                       hx-target="#cart-zone"
                       hx-swap="outerHTML"
                />

            </td>
            <td th:text="${item.subTotal}"></td>

       <td>
           <button type="button"
   th:hx-post="|/pos/cart/remove/${stat.index}|"
   hx-include="#active-cart-form , #disc , #paid ,#customerInfo"
   hx-target="#cart-zone"
   hx-swap="outerHTML"
           >X</button>
       </td>



        </tr>


        </tbody>
    </table>
</form>
<article>
<header><strong>Order Summary</strong></header>
<label for="disc">Global Order Discount:</label>
    <input id="disc" type="number" step="0.01" name="discount" th:value="${globalDiscount!=null ? globalDiscount : 0.00}"

           hx-post="/pos/cart/update"
           hx-include="#active-cart-form ,#disc ,#paid ,#customerInfo"
           hx-trigger="change delay:300ms"
           hx-target="#cart-zone"
           hx-swap="outerHTML"
    >

    <label for="paid">paid:</label>
    <input id="paid" type="number" step="0.01" name="paid" th:value="${paid!=null ? paid :0.00}"
          hx-post="/pos/cart/update"
           hx-include="#active-cart-form , #disc , #paid ,#customerInfo"
           hx-trigger="change delay:300ms"
           hx-target="#cart-zone"
           hx-swap="outerHTML"
    >
    <h3>Grand Total: <span th:text="${grandTotal!=null ? grandTotal :0.00}"></span></h3>
    <h4>remaining:<span id="remaining-display" th:text="${remaining!=null ? remaining : 0.00}"></span></h4>
    <h5>orderId:<span id="orderNumber-display" th:text="${orderNumber}"></span></h5>
    <input id="remaining" type="hidden" name="remaining" th:value="${remaining != null ? remaining : 0.00}" form="active-cart-form" />
    <input id="orderNumber" type="hidden" th:value="${orderNumber}" form="active-cart-form" />

    <div id="list-error"   style="color: red; font-weight: bold; margin-top: 5px;"></div>


    <button type="button"    th:if="${ordId !=null}"    th:hx-patch="|/pos/update/${ordId}|"     hx-include="#active-cart-form, #disc, #paid, #customerInfo ,#remaining" hx-target="#cart-zone">update</button>

    <button type="button"    th:if="${ordId ==null}"    hx-post="/pos/check-out"     hx-include="#active-cart-form, #disc, #paid, #customerInfo ,#remaining" hx-target="#cart-zone">checkOut</button>

<button type="button" hx-delete="/pos/clear" hx-target="#cart-zone" th:hx-confirm="|are you sure to clear order with total : ${grandTotal}|" >clear</button>

</article>
</div>


</body>
</html>
