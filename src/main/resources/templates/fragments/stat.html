<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stat Results</title>
</head>
<body>

<div th:fragment="stat-res" th:object="${res}" style="margin-top: 30px;">

    <h3 style="margin-bottom: 20px;" th:text="#{stat.timeframe.results.title}">Timeframe Results</h3>

    <div th:if="${res != null}" class="grid">

        <article class="stat-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px; color: var(--brand-teal); margin-bottom: 8px;"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            <p style="margin-bottom: 10px; font-weight: bold; color: var(--pico-muted-color);" th:text="#{stat.totalSales}">
                Total Sales
            </p>
            <h2 style="margin: 0;" th:text="*{totalSales != null ? totalSales : '0.00'}"></h2>
        </article>

        <article class="stat-card stat-card--profit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px; color: var(--brand-green); margin-bottom: 8px;"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
            <p style="margin-bottom: 10px; font-weight: bold; color: var(--pico-muted-color);" th:text="#{stat.totalProfit}">
                Total Profit
            </p>
            <h2 style="margin: 0; color: var(--brand-green);" th:text="*{totalProfit != null ? totalProfit : '0.00'}"></h2>
        </article>


        <article class="stat-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px; color: var(--brand-teal); margin-bottom: 8px;"><path d="M12 20V10"></path><path d="M18 20V4"></path><path d="M6 20v-4"></path></svg>
            <p style="margin-bottom: 10px; font-weight: bold; color: var(--pico-muted-color);" th:text="#{stat.topSellingItems}">
                top Selling items
            </p>
            <table>
                <thead>
                <tr>
                    <th th:text="#{stat.itemName}">itemName</th>
                    <th th:text="#{stat.totalQuantitySold}">totalQuantitySold</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${top}">
                    <td th:text="${item.itemName}"></td>
                    <td th:text="${item.totalQuantitySold}"></td>
                </tr>
                </tbody>
            </table>
        </article>


        <article class="stat-card stat-card--warn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px; color: var(--brand-amber); margin-bottom: 8px;"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
            <p style="margin-bottom: 10px; font-weight: bold; color: var(--pico-muted-color);" th:text="#{stat.leastSellingItems}">
                least Selling items
            </p>
            <table>
                <thead>
                <tr>
                    <th th:text="#{stat.itemName}">itemName</th>
                    <th th:text="#{stat.totalQuantitySold}">totalQuantitySold</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${least}">
                    <td th:text="${item.itemName}"></td>
                    <td th:text="${item.totalSoldQuantity}"></td>
                </tr>
                </tbody>
            </table>
        </article>

    </div>

    <div th:if="${res == null}" class="form-error" th:text="#{stat.invalidDateRange}">
        please select a valid date range
    </div>
</div>
</body>
</html>
