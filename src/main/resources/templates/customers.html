<div>

    <h2 class="page-heading">
        <svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span th:text="#{customers.title}">customers</span>
    </h2>

    <div id="search-bar" style="display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap;">

        <label for="customer-search" th:text="#{customers.search.label}" style="flex: 1; min-width: 200px;">search for customers</label>
        <input id="customer-search" name="keyword" th:placeholder="#{customers.search.placeholder}" type="text" hx-get="/customers/part-search"
               hx-target="#table-customers"
               hx-swap="innerHTML"
               hx-trigger="keyup changed delay:500ms"
               style="flex: 2; min-width: 200px;"
        />
        <button hx-get="customers/create2"
                hx-target="#modal-container-cust2"
                hx-swap="innerHTML"
                th:text="#{customers.btn.create}"
        >create</button>
    </div>
    <h3 th:text="#{customers.viewAll}">view all customers</h3>
    <!-- We moved the id and fragment to a wrapper div so HTMX can swap the table AND the page numbers together -->
    <div id="table-customers" th:fragment="customers">
        <figure>
        <table role="grid">
            <thead>
            <tr>
                <th th:text="#{customers.table.name}">name</th>
                <th th:text="#{customers.table.location}">location</th>
                <th th:text="#{customers.table.shippingCompany}">shipping-company</th>
                <th th:text="#{customers.table.mobileNumber}">mobile-number</th>
                <th></th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cust : ${custs.content}">
                <td><strong th:text="${cust.name}"></strong></td>
                <td th:text="${cust.location}"></td>
                <td th:text="${cust.shippingCompany}"></td>
                <td th:text="${cust.phoneNumber}"></td>
                <td>
                    <button type="button" class="secondary outline" style="padding: 4px 10px;" th:hx-get="@{/customers/update/{id}(id=${cust.id})}"
                            hx-target="#pop-customer-container"
                            hx-swap="innerHTML"
                            th:text="#{btn.update}">
                        update
                    </button>
                </td>
                <td>
                    <button type="button" class="contrast outline" style="padding: 4px 10px;" th:hx-delete="@{/customers/{id}(id=${cust.id})}"
                            hx-target="#table-customers"
                            hx-swap="innerHTML"
                            th:hx-confirm="#{customers.confirm.delete(${cust.name})}"
                            th:text="#{btn.delete}">
                        delete
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
        </figure>

        <!-- Pagination & View Numbers -->
        <div th:if="${custs.totalElements > 0}" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 10px 0;">

            <!-- View Numbers -->
            <div class="pagination-info"
                 th:text="#{pagination.showing(${custs.totalElements > 0 ? (custs.number * custs.size + 1) : 0}, ${custs.number * custs.size + custs.numberOfElements}, ${custs.totalElements})}">
                Showing 1 to 10 of 20 entries
            </div>

            <!-- Page Controllers -->
            <nav style="display: flex; align-items: center; gap: 10px;">
                <button th:if="${custs.hasPrevious()}"
                        th:hx-get="@{/customers(page=${custs.number-1}, keyword=${param.keyword})}"
                        hx-target="#table-customers"
                        hx-swap="outerHTML"
                        hx-push-url="true"
                        class="secondary small"
                        th:text="#{pagination.previous}">
                    previous
                </button>

                <span style="font-size: 0.9em; font-weight: 500;"
                      th:text="#{pagination.page(${custs.number+1}, ${custs.totalPages == 0 ? 1 : custs.totalPages})}">
                    page 1 of 1
                </span>

                <button th:if="${custs.hasNext()}"
                        th:hx-get="@{/customers(page=${custs.number+1}, keyword=${param.keyword})}"
                        hx-target="#table-customers"
                        hx-swap="outerHTML"
                        hx-push-url="true"
                        class="secondary small"
                        th:text="#{pagination.next}">
                    next
                </button>
            </nav>
        </div>
    </div>
</div>

<div id="pop-customer-container">

</div>
<!-- Customer Modal Container -->
<div id="modal-container-cust2" hx-on:close-modal="this.innerHTML=''"></div>
