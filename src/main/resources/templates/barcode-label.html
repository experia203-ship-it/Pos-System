<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{label.print.title}">Print Label</title>
    <!-- Pulls in the library to generate the barcode lines -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        /* --- 1. Screen Preview Styling (What you see on the monitor) --- */
        body {
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .label-container {
            background-color: white;
            /* 50mm x 25mm is the standard wholesale/retail label size */
            width: 50mm;
            height: 25mm;
            padding: 2mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #94a3b8; /* Border for screen preview only */
            border-radius: 4px;
        }

        .product-name {
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .price {
            font-size: 11px;
            font-weight: bold;
        }

        svg {
            width: 100%;
            max-height: 12mm; /* Keeps the barcode from overflowing the sticker */
        }

        /* --- 2. The Magic Hardware Print Rules (What the printer sees) --- */
        @media print {
            @page {
                size: 50mm 25mm; /* Forces the browser to format for the thermal roll */
                margin: 0;
            }
            body {
                background-color: white;
                height: auto;
                display: block;
            }
            .label-container {
                border: none; /* Removes the border so it doesn't print */
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

<!-- This div represents the physical sticker -->
<div class="label-container">
    <div class="product-name" th:text="${product.name}">Product Name</div>

    <!-- JsBarcode will draw the barcode lines inside this SVG -->
    <svg id="barcode"></svg>

    <div class="price" th:text="#{label.currency} + ' ' + ${product.sellingPrice}">EGP 0.00</div>
</div>

<script th:inline="javascript">
    // Safe translation variable for JavaScript alert
    const noBarcodeMsg = /*[[#{label.print.error.noBarcode}]]*/ "Cannot print: This product does not have a barcode assigned.";

    // 1. Safely pull the barcode string from your Java backend into JavaScript
    const barcodeValue = /*[[${product.barcode}]]*/ '';

    if (barcodeValue) {
        // 2. Instruct the library to draw the lines
        JsBarcode("#barcode", barcodeValue, {
            format: "CODE128",  // The most reliable format for mixed numbers/letters
            width: 1.5,         // Line thickness
            height: 40,         // Line height
            displayValue: true, // Shows the numbers underneath the lines
            fontSize: 12,
            margin: 0
        });

        // 3. Automatically trigger the print dialog as soon as the lines are drawn
        window.onload = function() {
            window.print();
        };

        // Optional: Automatically close this window after they hit print
        window.onafterprint = function() {
            window.close();
        }
    } else {
        // Failsafe if they try to print a product that has no barcode
        alert(noBarcodeMsg);
        window.close();
    }
</script>

</body>
</html>
