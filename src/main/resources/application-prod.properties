# ===============================
# SQLITE CONNECTION (CLIENT EXE)
# ===============================
# A relative path creates it in the exact same folder the app is launched from
spring.datasource.url=jdbc:sqlite:file:pos_database.sqlite?busy_timeout=30000&journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Use the standard Hibernate 6 SQLite dialect
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Let Flyway build the tables; prevent Hibernate from trying to update or validate them at startup
spring.jpa.hibernate.ddl-auto=none

# ===============================
# FLYWAY MIGRATION
# ===============================
# Run SQLite-specific migration scripts
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.baseline-on-migrate=true

# Seed the settings row after Flyway has created the schema.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

app.demo.auto-reset=true