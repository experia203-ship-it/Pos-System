spring.application.name=pos

spring.profiles.active=prod
spring.profiles.group.demo=prod,demo-reset
app.demo.auto-reset=false
app.security.cookie-secure=${COOKIE_SECURE:false}
server.port=${PORT:8080}

# Keep form submissions and rendered product names Unicode-safe.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# ===============================


# ===============================
# FILE UPLOAD
# ===============================
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

#jwt secrets
jwt.secret=${JWT_SECRET:}

#logging.level.org.hibernate.orm.boot.bind=TRACE
#logging.level.org.springframework.orm.jpa=DEBUG
#logging.level.org.springframework.security=DEBUG
logging.level.root=INFO
server.address=127.0.0.1
logging.file.name=${app.data.dir}/logs/pos.log

# ===============================
# LICENSING
# ===============================
# Licensing is only enforced in the installed app: build-installer.bat starts it with -Dapp.license.enabled=true.
# Your WhatsApp number for the "Send on WhatsApp" button: digits only, with country code (example: 201001234567).
# Leave it empty to hide the button.
app.license.support-whatsapp=201091880840

app.desktop.enable=true
