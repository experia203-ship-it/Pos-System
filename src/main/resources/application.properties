spring.application.name=pos


# ===============================
# DATABASE CONNECTION
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/pos_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# ===============================
# FLYWAY MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# This allows Flyway to 'take over' an existing database safely
#spring.flyway.baseline-on-migrate=true

# ===============================
# FILE UPLOAD
# ===============================
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

#jwt secrets
jwt.secret=${JWT_SECRET:YjY0ZDI3M2I0YmE0YmI0YmI0YmI0YmI0YmI0YmI0YmI0YmI0YmI0YmI0YmI0YmI0YmI0YmI0Yg}

